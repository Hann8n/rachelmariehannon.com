    <!-- Free Substack feed via RSS (no Supascribe) -->
    <script>
        (function() {
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            function substackUrlToRss(url) {
                if (!url) return null;
                try {
                    const u = new URL(url);
                    if (u.hostname === 'substack.com' && u.pathname.startsWith('/@')) {
                        const handle = u.pathname.replace(/^\/@/, '').replace(/\/.*$/, '');
                        return 'https://' + handle + '.substack.com/feed';
                    }
                    if (u.hostname.endsWith('.substack.com')) {
                        return u.origin + '/feed';
                    }
                } catch (_) {}
                return null;
            }
            function stripHtml(html) {
                if (!html) return '';
                const div = document.createElement('div');
                div.innerHTML = html;
                return div.textContent || div.innerText || '';
            }
            function calculateReadTime(content) {
                if (!content) return '';
                const text = stripHtml(content);
                const wordCount = text.split(/\s+/).filter(function(word) { return word.length > 0; }).length;
                const readTime = Math.ceil(wordCount / 200);
                return readTime > 0 ? readTime + ' min read' : '';
            }
            function renderFeedItem(item) {
                const link = item.link || '#';
                const title = item.title || 'Post';
                const rawDescription = item.description || '';
                const cleanDescription = stripHtml(rawDescription).trim();
                const imageUrl = item.enclosure && item.enclosure.link ? item.enclosure.link : '';
                const readTime = calculateReadTime(item.content || item.description);
                const author = item.author || '';
                const categories = item.categories || [];
                let date = '';
                if (item.pubDate) {
                    try {
                        const pubDate = new Date(item.pubDate);
                        const now = new Date();
                        const diffMs = now - pubDate;
                        const diffMinutes = Math.floor(diffMs / (1000 * 60));
                        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                        
                        if (diffMinutes < 1) {
                            date = 'Just now';
                        } else if (diffMinutes < 60) {
                            date = diffMinutes === 1 ? '1 minute ago' : diffMinutes + ' minutes ago';
                        } else if (diffHours < 24) {
                            date = diffHours === 1 ? '1 hour ago' : diffHours + ' hours ago';
                        } else if (diffDays < 7) {
                            date = diffDays === 1 ? '1 day ago' : diffDays + ' days ago';
                        } else {
                            date = pubDate.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
                        }
                    } catch (_) {}
                }
                let imageHtml = '';
                if (imageUrl) {
                    imageHtml = '<div class="substack-feed-card-image"><img src="' + escapeHtml(imageUrl) + '" alt="' + escapeHtml(title) + '" loading="lazy"></div>';
                }
                const metaInfo = [];
                if (date) metaInfo.push(date);
                if (readTime) metaInfo.push(readTime);
                const metaText = metaInfo.join(' • ');
                
                let tagsHtml = '';
                if (categories && categories.length > 0) {
                    const tags = categories.slice(0, 3).map(function(cat) {
                        return '<span class="substack-feed-card-tag">' + escapeHtml(cat) + '</span>';
                    }).join('');
                    tagsHtml = '<div class="substack-feed-card-tags">' + tags + '</div>';
                }
                
                return '<a href="' + escapeHtml(link) + '" target="_blank" rel="noopener noreferrer" class="substack-feed-card">' +
                    '<div class="substack-feed-card-content">' +
                    '<h3 class="substack-feed-card-title">' + escapeHtml(title) + '</h3>' +
                    (metaText ? '<span class="substack-feed-card-meta">' + escapeHtml(metaText) + '</span>' : '') +
                    (cleanDescription ? '<p class="substack-feed-card-description">' + escapeHtml(cleanDescription.substring(0, 120)) + (cleanDescription.length > 120 ? '…' : '') + '</p>' : '') +
                    tagsHtml +
                    '</div>' +
                    imageHtml +
                    '</a>';
            }
            var loadingHtml = '<div class="substack-feed-loading" aria-busy="true" aria-label="Loading feed"></div>';
            window.SUBSTACK_SKELETON_HTML = loadingHtml;

            function loadSubstackFeeds() {
                document.querySelectorAll('[data-substack-feed]').forEach(function (el) {
                    const url = el.getAttribute('data-substack-url');
                    const rssUrl = substackUrlToRss(url);
                    if (!rssUrl) {
                        el.innerHTML = '';
                        return;
                    }
                    if (!el.querySelector('.substack-feed-loading')) {
                        el.innerHTML = loadingHtml;
                    }
                    const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);
                    fetch(apiUrl)
                        .then(function (r) {
                            if (!r.ok) {
                                throw new Error('HTTP ' + r.status);
                            }
                            return r.json();
                        })
                        .then(function (data) {
                            if (data.status !== 'ok' || !data.items || !data.items.length) {
                                el.innerHTML = '<p class="substack-feed-error">No posts available.</p>';
                                return;
                            }
                            const allItems = data.items;
                            const initialCount = 4;
                            let displayedCount = initialCount;
                            
                            const container = document.createElement('div');
                            container.className = 'substack-feed-cards';
                            container.innerHTML = allItems.slice(0, displayedCount).map(renderFeedItem).join('');
                            
                            const loadMoreBtn = document.createElement('button');
                            loadMoreBtn.className = 'button secondary-button substack-load-more';
                            loadMoreBtn.textContent = 'Load more';
                            loadMoreBtn.type = 'button';
                            
                            if (displayedCount >= allItems.length) {
                                loadMoreBtn.style.display = 'none';
                            }
                            
                            loadMoreBtn.addEventListener('click', function() {
                                const nextBatch = allItems.slice(displayedCount, displayedCount + 4);
                                if (nextBatch.length > 0) {
                                    nextBatch.forEach(function(item) {
                                        container.insertAdjacentHTML('beforeend', renderFeedItem(item));
                                    });
                                    displayedCount += nextBatch.length;
                                    if (displayedCount >= allItems.length) {
                                        loadMoreBtn.style.display = 'none';
                                    }
                                }
                            });
                            
                            el.innerHTML = '';
                            el.appendChild(container);
                            el.appendChild(loadMoreBtn);
                        })
                        .catch(function (err) {
                            console.error('Substack feed error:', err);
                            el.innerHTML = '<p class="substack-feed-error">Unable to load feed. <a href="' + escapeHtml(rssUrl.replace('/feed', '')) + '" target="_blank" rel="noopener noreferrer">Visit Substack</a></p>';
                        });
                });
            }
            window.loadSubstackFeeds = loadSubstackFeeds;
            function initFeeds() {
                loadSubstackFeeds();
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initFeeds);
            } else {
                setTimeout(initFeeds, 100);
            }
        })();
    </script>

            x: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M22.46 6c-.77.35-1.6.58-2.46.69c.88-.53 1.56-1.37 1.88-2.38c-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29c0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15c0 1.49.75 2.81 1.91 3.56c-.71 0-1.37-.2-1.95-.5v.03c0 2.08 1.48 3.82 3.44 4.21a4.2 4.2 0 0 1-1.93.07a4.28 4.28 0 0 0 4 2.98a8.52 8.52 0 0 1-5.33 1.84q-.51 0-1.02-.06C3.44 20.29 5.7 21 8.12 21C16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56c.84-.6 1.56-1.36 2.14-2.23"/></svg>',

        };
        const iconSvg = (key) => {
            const svg = SOCIAL_ICONS[key.toLowerCase()];
            return svg ? svg.replace('<svg ', '<svg aria-hidden="true" ') : null;
        };
        const placeDetailsCache = new Map();

        function extractPlaceIdFromMapsUrl(urlText) {
            if (!urlText || typeof urlText !== 'string') return '';
            const normalized = normalizeUrl(urlText);
            if (!normalized) return '';

            try {
                const parsed = new URL(normalized);
                const fromQuery = parsed.searchParams.get('query_place_id') || parsed.searchParams.get('place_id');
                if (fromQuery) return fromQuery;

                const qParam = parsed.searchParams.get('q') || parsed.searchParams.get('query');
                if (qParam && qParam.startsWith('place_id:')) {
                    return qParam.replace(/^place_id:/, '');
                }
            } catch (_) {}

            const decoded = decodeURIComponent(normalized);
            const match = decoded.match(/ChI[0-9A-Za-z_-]{10,}/);
            return match ? match[0] : '';
        }

        function getEventPlaceId(eventEntry) {
            if (eventEntry.place_id && typeof eventEntry.place_id === 'string') {
                return eventEntry.place_id.trim();
            }
            return extractPlaceIdFromMapsUrl(eventEntry.google_maps_url);
        }

        function parseEventDate(dateText) {
            if (!dateText || typeof dateText !== 'string') return null;
            const match = dateText.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!match) return null;
            const year = Number(match[1]);
            const month = Number(match[2]);
            const day = Number(match[3]);
            const parsed = new Date(year, month - 1, day);
            if (
                Number.isNaN(parsed.getTime()) ||
                parsed.getFullYear() !== year ||
                parsed.getMonth() !== month - 1 ||
                parsed.getDate() !== day
            ) {
                return null;
            }
            parsed.setHours(0, 0, 0, 0);
            return parsed;
        }

        function applyLegacyTime(baseDate, timeText) {
            if (!baseDate || !timeText || typeof timeText !== 'string') return baseDate;
            const copy = new Date(baseDate.getTime());
            const trimmed = timeText.trim();

            const twelveHour = trimmed.match(/^(\d{1,2})(?::(\d{2}))?\s*([AaPp][Mm])$/);
            if (twelveHour) {
                let hour = Number(twelveHour[1]);
                const minute = Number(twelveHour[2] || '0');
                const meridiem = twelveHour[3].toUpperCase();
                if (hour === 12) hour = 0;
                if (meridiem === 'PM') hour += 12;
                copy.setHours(hour, minute, 0, 0);
                return copy;
            }

            const twentyFourHour = trimmed.match(/^(\d{1,2}):(\d{2})$/);
            if (twentyFourHour) {
                const hour = Number(twentyFourHour[1]);
                const minute = Number(twentyFourHour[2]);
                if (hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59) {
                    copy.setHours(hour, minute, 0, 0);
                }
            }

            return copy;
        }

        function parseEventStart(eventEntry) {
            const startsAt = eventEntry && typeof eventEntry.starts_at === 'string'
                ? eventEntry.starts_at.trim()
                : '';

            if (startsAt) {
                const parsedStart = new Date(startsAt);
                if (!Number.isNaN(parsedStart.getTime())) {
                    return parsedStart;
                }
            }

            const legacyDate = parseEventDate(eventEntry && eventEntry.date);
            if (!legacyDate) return null;
            return applyLegacyTime(legacyDate, eventEntry.time);
        }

        function getTodayStart() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return today;
        }

        function formatEventDate(date) {
            if (!date) return '';
            return date.toLocaleDateString(undefined, {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function formatEventTime(date) {
            if (!date) return '';
            const midnight = date.getHours() === 0 && date.getMinutes() === 0;
            if (midnight) return '';
            return date.toLocaleTimeString(undefined, {
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        function formatEventBadge(date) {
            if (!date) return null;
            return {
                month: date.toLocaleDateString(undefined, { month: 'short' }).toUpperCase(),
                day: String(date.getDate())
            };
        }

        function normalizeUrl(urlText) {
            if (!urlText || typeof urlText !== 'string') return '';
            try {
                return new URL(urlText).href;
            } catch (_) {
                return '';
            }
        }

        function buildDirectionsUrl(eventEntry) {
            const explicitMapUrl = normalizeUrl(eventEntry.google_maps_url);
            if (explicitMapUrl) return explicitMapUrl;
            const query = [eventEntry.venue, eventEntry.city].filter(Boolean).join(', ');
            if (!query) return '';
            return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
        }

        function buildMapEmbedUrl(eventEntry) {
            const placeId = getEventPlaceId(eventEntry);
            if (placeId) {
                return 'https://www.google.com/maps?q=place_id:' + encodeURIComponent(placeId) + '&output=embed';
            }
            const query = [eventEntry.venue, eventEntry.city].filter(Boolean).join(', ');
            if (!query) return '';
            return 'https://www.google.com/maps?q=' + encodeURIComponent(query) + '&output=embed';
        }

        function extractLatLngFromMapsUrl(urlText) {
            const normalized = normalizeUrl(urlText);
            if (!normalized) return null;
            try {
                const parsed = new URL(normalized);
                const atMatch = parsed.pathname.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
                if (atMatch) return { lat: atMatch[1], lng: atMatch[2] };

                const ll = parsed.searchParams.get('ll') || parsed.searchParams.get('sll');
                if (ll && /^-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?$/.test(ll)) {
                    const [lat, lng] = ll.split(',');
                    return { lat, lng };
                }
            } catch (_) {}
            return null;
        }

        function buildDirectionsProviderUrls(options) {
            const placeId = (options && options.placeId ? String(options.placeId) : '').trim();
            const mapsUrl = options && options.mapsUrl ? String(options.mapsUrl) : '';
            const fallbackUrl = normalizeUrl(options && options.fallbackUrl ? String(options.fallbackUrl) : '');
            const destination = [options?.venue, options?.city].filter(Boolean).join(', ').trim();
            const latLng = extractLatLngFromMapsUrl(mapsUrl) || extractLatLngFromMapsUrl(fallbackUrl);

            let google = '';
            if (destination || placeId) {
                const destinationValue = destination || ('place_id:' + placeId);
                google = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(destinationValue);
                if (placeId) {
                    google += '&destination_place_id=' + encodeURIComponent(placeId);
                }
            } else if (fallbackUrl) {
                google = fallbackUrl;
            }

            const apple = destination
                ? 'https://maps.apple.com/?daddr=' + encodeURIComponent(destination) + '&dirflg=d'
                : '';

            let waze = '';
            if (latLng) {
                waze = 'https://waze.com/ul?ll=' + encodeURIComponent(latLng.lat + ',' + latLng.lng) + '&navigate=yes';
            } else if (destination) {
                waze = 'https://waze.com/ul?q=' + encodeURIComponent(destination) + '&navigate=yes';
            }

            return {
                google,
                apple,
                waze,
                fallback: google || fallbackUrl || ''
            };
        }

        function getDirectionsDialog() {
            let overlay = document.getElementById('directions-picker');
            if (overlay) return overlay;

            overlay = document.createElement('div');
            overlay.id = 'directions-picker';
            overlay.className = 'directions-picker';
            overlay.hidden = true;
            overlay.innerHTML =
                '<div class="directions-picker-backdrop" data-close-directions-picker></div>' +
                '<div class="directions-picker-panel" role="dialog" aria-modal="true" aria-labelledby="directions-picker-title">' +
                '<h3 id="directions-picker-title">Open directions in</h3>' +
                '<div class="directions-picker-actions">' +
                '<button type="button" class="directions-picker-option" data-provider="apple">Apple Maps</button>' +
                '<button type="button" class="directions-picker-option" data-provider="google">Google Maps</button>' +
                '<button type="button" class="directions-picker-option" data-provider="waze">Waze</button>' +
                '</div>' +
                '<button type="button" class="directions-picker-cancel" data-close-directions-picker>Cancel</button>' +
                '</div>';
            document.body.appendChild(overlay);
            return overlay;
        }

        function closeDirectionsPicker() {
            const overlay = document.getElementById('directions-picker');
            if (!overlay) return;
            overlay.hidden = true;
            overlay.removeAttribute('data-open');
            overlay.removeAttribute('data-google-url');
            overlay.removeAttribute('data-apple-url');
            overlay.removeAttribute('data-waze-url');
        }

        function openDirectionsPicker(urls, label) {
            const overlay = getDirectionsDialog();
            const title = overlay.querySelector('#directions-picker-title');
            if (title) {
                title.textContent = 'Open directions in:';
            }

            overlay.setAttribute('data-google-url', urls.google || '');
            overlay.setAttribute('data-apple-url', urls.apple || '');
            overlay.setAttribute('data-waze-url', urls.waze || '');
            overlay.hidden = false;
            overlay.setAttribute('data-open', 'true');

            ['apple', 'google', 'waze'].forEach((provider) => {
                const btn = overlay.querySelector('[data-provider="' + provider + '"]');
                if (!btn) return;
                const hasUrl = Boolean(urls[provider]);
                btn.disabled = !hasUrl;
                btn.setAttribute('aria-disabled', String(!hasUrl));
            });
        }

        function initializeDirectionsPicker() {
            if (document.body.dataset.directionsPickerReady === 'true') return;
            document.body.dataset.directionsPickerReady = 'true';

            document.addEventListener('click', async (event) => {
                const closeTrigger = event.target.closest('[data-close-directions-picker]');
                if (closeTrigger) {
                    closeDirectionsPicker();
                    return;
                }

                const providerButton = event.target.closest('.directions-picker-option[data-provider]');
                if (providerButton) {
                    const overlay = document.getElementById('directions-picker');
                    if (!overlay) return;
                    const provider = providerButton.getAttribute('data-provider');
                    const url = overlay.getAttribute('data-' + provider + '-url');
                    if (url) {
                        window.open(url, '_blank', 'noopener,noreferrer');
                    }
                    closeDirectionsPicker();
                    return;
                }

                const directionsLink = event.target.closest('.event-directions');
                if (!directionsLink) return;
                event.preventDefault();

                const card = directionsLink.closest('.event-card');
                const placeId = card ? (card.getAttribute('data-place-id') || '').trim() : '';
                const mapsUrl = card ? (card.getAttribute('data-google-maps-url') || '').trim() : '';
                const venue = card ? (card.getAttribute('data-venue') || '').trim() : '';
                const city = card ? (card.getAttribute('data-city') || '').trim() : '';
                const fallbackUrl = directionsLink.getAttribute('href') || '';
                const urls = buildDirectionsProviderUrls({ placeId, mapsUrl, venue, city, fallbackUrl });

                if (!urls.fallback) return;
                openDirectionsPicker(urls, venue || '');
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeDirectionsPicker();
                }
            });
        }

        async function fetchPlaceDetails(options) {
            const placeId = options && typeof options.placeId === 'string' ? options.placeId.trim() : '';
            const mapsUrl = options && typeof options.mapsUrl === 'string' ? options.mapsUrl.trim() : '';
            const query = [options?.venue, options?.city].filter(Boolean).join(', ');
            const cacheKey = placeId || mapsUrl || query;
            if (!cacheKey) return null;
            if (placeDetailsCache.has(cacheKey)) {
                return placeDetailsCache.get(cacheKey);
            }
            try {
                const params = new URLSearchParams();
                if (placeId) params.set('placeId', placeId);
                if (mapsUrl) params.set('mapsUrl', mapsUrl);
                if (query) params.set('query', query);
                const response = await fetch('/api/place-details?' + params.toString());
                if (!response.ok) return null;
                const data = await response.json();
                const normalized = {
                    name: typeof data.name === 'string' ? data.name : '',
                    url: normalizeUrl(data.url),
                    photoUrl: typeof data.photoUrl === 'string' ? data.photoUrl : '',
                    resolvedPlaceId: typeof data.resolvedPlaceId === 'string' ? data.resolvedPlaceId : ''
                };
                placeDetailsCache.set(cacheKey, normalized);
                if (normalized.resolvedPlaceId && normalized.resolvedPlaceId !== cacheKey) {
                    placeDetailsCache.set(normalized.resolvedPlaceId, normalized);
                }
                return normalized;
            } catch (_) {
                return null;
            }
        }

        async function enrichEventCardsWithPlaceData() {
            const cards = Array.from(document.querySelectorAll('.event-card[data-google-maps-url]'));
            if (!cards.length) return;

            await Promise.all(cards.map(async (card) => {
                const mapsUrl = card.getAttribute('data-google-maps-url') || '';
                const placeIdAttr = (card.getAttribute('data-place-id') || '').trim();
                const placeId = placeIdAttr || extractPlaceIdFromMapsUrl(mapsUrl);
                const venue = card.getAttribute('data-venue') || '';
                const city = card.getAttribute('data-city') || '';
                if (!placeId && !mapsUrl && !venue && !city) return;

                const place = await fetchPlaceDetails({
                    placeId,
                    mapsUrl,
                    venue,
                    city
                });
                if (!place) return;

                if (!placeIdAttr && place.resolvedPlaceId) {
                    card.setAttribute('data-place-id', place.resolvedPlaceId);
                }

                const directionsLink = card.querySelector('.event-directions');
                if (directionsLink && place.url) {
                    directionsLink.setAttribute('href', place.url);
                }

                const photoWrapper = card.querySelector('[data-event-photo]');
                const photoImg = card.querySelector('[data-event-photo-img]');
                if (!photoWrapper || !photoImg || !place.photoUrl) return;
                photoImg.setAttribute('src', place.photoUrl);
                photoImg.setAttribute('alt', (place.name || 'Venue') + ' photo');
                photoWrapper.hidden = false;
            }));
        }

        async function initializeEventEnhancements() {
            initializeDirectionsPicker();
            await enrichEventCardsWithPlaceData();
        }
        
        // Section renderers - cleaner, more maintainable approach
        const SectionRenderers = {
            text: (section) => {
                const parts = [];
                if (section.title) parts.push(`<h2>${sanitizeHtml(section.title)}</h2>`);
                if (section.tagline) parts.push(`<p class="section-tagline">${escapeHtml(section.tagline)}</p>`);
                if (section.content) parts.push(`<p class="lede">${escapeHtml(section.content)}</p>`);
                if (section.paragraphs?.length) {
                    section.paragraphs.forEach(p => p.text && parts.push(`<p>${escapeHtml(p.text)}</p>`));
                }
                return parts.join('');
            },
            
            quote: (section) => {
                const parts = [];
                if (section.title) parts.push(`<h2>${sanitizeHtml(section.title)}</h2>`);
                if (section.quote) {
                    parts.push('<blockquote>');
                    parts.push(`<span>"${escapeHtml(section.quote)}"</span>`);
                    if (section.attribution) {
                        parts.push(`<span class="quote-attribution">– ${escapeHtml(section.attribution)}</span>`);
                    }
                    parts.push('</blockquote>');
                }
                return parts.join('');
            },
            
            list: (section) => {
                const parts = [];
                if (section.title) parts.push(`<h2>${sanitizeHtml(section.title)}</h2>`);
                if (section.tagline) parts.push(`<p class="section-tagline">${escapeHtml(section.tagline)}</p>`);
                if (section.items?.length) {
                    parts.push('<ul>');
                    section.items.forEach(item => {
                        parts.push('<li>');
                        if (item.title) parts.push(`<strong>${escapeHtml(item.title)}</strong> `);
                        if (item.description) parts.push(escapeHtml(item.description));
                        parts.push('</li>');
                    });
                    parts.push('</ul>');
                }
                return parts.join('');
            },
            
            'two-column': (section) => {
                const parts = [];
                if (section.title) parts.push(`<h2>${sanitizeHtml(section.title)}</h2>`);
                parts.push('<div class="about-grid">');
                
                // Left column
                if (section.left_column) {
                    parts.push('<div class="about-block">');
                    if (section.left_column.title) parts.push(`<h3>${escapeHtml(section.left_column.title)}</h3>`);
                    if (section.left_column.items?.length) {
                        parts.push('<ul>');
                        section.left_column.items.forEach(item => {
                            parts.push('<li>');
                            if (item.title) parts.push(`<strong>${escapeHtml(item.title)}</strong> `);
                            if (item.description) parts.push(escapeHtml(item.description));
                            parts.push('</li>');
                        });
                        parts.push('</ul>');
                    }
                    parts.push('</div>');
                }
                
                // Right column
                if (section.right_column) {
                    parts.push('<div class="about-block">');
                    if (section.right_column.title) parts.push(`<h3>${escapeHtml(section.right_column.title)}</h3>`);
                    if (section.right_column.content) {
                        const formatted = escapeHtml(section.right_column.content)
                            .replace(/\n\n/g, '</p><p>')
                            .replace(/\n/g, '<br>');
                        parts.push(`<div>${formatted}</div>`);
                    }
                    parts.push('</div>');
                }
                
                parts.push('</div>');
                return parts.join('');
            },
            
            inquiries: (section) => {
                const parts = [];
                parts.push('<div class="inquiries-layout">');
                parts.push('<div class="inquiries-header">');
                if (section.title) parts.push(`<h2>${sanitizeHtml(section.title)}</h2>`);
                if (section.email) {
                    const mailto = 'mailto:' + section.email.replace(/^mailto:/, '');
                    const label = section.button_text || 'Email me';
                    parts.push(`<a href="${escapeHtml(mailto)}" class="substack-header-link" aria-label="Email ${escapeHtml(section.email)}">`);
                    parts.push('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="96 160 864 512" aria-hidden="true"><path fill="currentColor" d="M928 160H96c-17.7 0-32 14.3-32 32v640c0 17.7 14.3 32 32 32h832c17.7 0 32-14.3 32-32V192c0-17.7-14.3-32-32-32m-80.8 108.9L531.7 514.4c-7.8 6.1-18.7 6.1-26.5 0L189.6 268.9A7.2 7.2 0 0 1 194 256h648.8a7.2 7.2 0 0 1 4.4 12.9"/></svg>');
                    parts.push(`<span class="substack-header-link-text">${escapeHtml(label)}</span></a>`);
                }
                parts.push('</div>');
                if (section.tagline) parts.push(`<p class="section-tagline">${escapeHtml(section.tagline)}</p>`);
                if (section.description) parts.push(`<p class="inquiries-description">${escapeHtml(section.description)}</p>`);
                parts.push('</div>');
                return parts.join('');
            },
            
            substack: (section) => {
                const parts = [];
                if (section.title || section.tagline) {
                    parts.push('<div class="section-header">');
                    parts.push('<div class="section-header-top">');
                    if (section.title) parts.push(`<h2>${sanitizeHtml(section.title)}</h2>`);
                    const substackUrl = section.button_url || 'https://substack.com/@imightbeanidiot';
                    parts.push(`<a href="${escapeHtml(substackUrl)}" target="_blank" rel="noopener noreferrer" class="substack-header-link" aria-label="Visit Substack">`);
                    parts.push('<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M15 3.604H1v1.891h14v-1.89ZM1 7.208V16l7-3.926L15 16V7.208zM15 0H1v1.89h14z"/></svg>');
                    parts.push('<span class="substack-header-link-text">Open on Substack</span>');
                    parts.push('</a>');
                    parts.push('</div>');
                    if (section.tagline) parts.push(`<p class="section-tagline">${escapeHtml(section.tagline)}</p>`);
                    parts.push('</div>');
                }
                if (section.button_url) {
                    parts.push('<div class="substack-feed-shell">');
                    const skeleton = (typeof window !== 'undefined' && window.SUBSTACK_SKELETON_HTML) ? window.SUBSTACK_SKELETON_HTML : '';
                    parts.push(`<div class="substack-feed-list" data-substack-feed data-substack-url="${escapeHtml(section.button_url)}">${skeleton}</div>`);
                    parts.push('</div>');
                }
                return parts.join('');
            },

            events: (section) => {
                const parts = [];
                const entries = Array.isArray(section.items)
                    ? section.items
                    : (Array.isArray(section.events) ? section.events : []);
                const today = getTodayStart();
                const upcomingEvents = entries
                    .map((entry, idx) => {
                        const parsedStart = parseEventStart(entry);
                        return { ...entry, _parsedStart: parsedStart, _idx: idx };
                    })
                    .filter(entry => entry._parsedStart && entry._parsedStart >= today)
                    .sort((a, b) => a._parsedStart - b._parsedStart || a._idx - b._idx);

                if (!upcomingEvents.length) {
                    return '';
                }

                if (section.title || section.tagline) {
                    parts.push('<div class="section-header">');
                    if (section.title) parts.push(`<h2>${sanitizeHtml(section.title)}</h2>`);
                    if (section.tagline) parts.push(`<p class="section-tagline">${escapeHtml(section.tagline)}</p>`);
                    parts.push('</div>');
                }

                parts.push('<div class="events-list">');
                upcomingEvents.forEach((eventEntry, idx) => {
                    const eventTimeLabel = formatEventTime(eventEntry._parsedStart) || eventEntry.time;
                    const eventBadge = formatEventBadge(eventEntry._parsedStart);
                    const directionsUrl = buildDirectionsUrl(eventEntry);
                    const mapEmbedUrl = buildMapEmbedUrl(eventEntry);
                    const placeId = getEventPlaceId(eventEntry);
                    const eventLink = normalizeUrl(eventEntry.link);
                    const hasDetails = Boolean(eventEntry.details);
                    const hasEventLink = Boolean(eventLink);
                    const hasDirections = Boolean(directionsUrl);
                    const eventMetaParts = [];
                    if (eventEntry.city) eventMetaParts.push(escapeHtml(eventEntry.city));
                    if (eventTimeLabel) eventMetaParts.push(escapeHtml(eventTimeLabel));
                    const eventMeta = eventMetaParts.join(' • ');

                    parts.push(
                        `<article class="event-card" data-google-maps-url="${escapeHtml(eventEntry.google_maps_url || '')}" data-place-id="${escapeHtml(placeId)}" data-venue="${escapeHtml(eventEntry.venue || '')}" data-city="${escapeHtml(eventEntry.city || '')}" data-event-label="${escapeHtml(eventEntry.venue || 'Event')}" data-event-index="${idx}">`
                    );
                    parts.push('<div class="event-card-layout">');
                    parts.push('<div class="event-card-main">');
                    parts.push('<div class="event-card-heading">');

                    if (eventBadge) {
                        parts.push(
                            '<div class="event-date-badge" aria-hidden="true">' +
                            `<span class="event-date-badge-month">${escapeHtml(eventBadge.month)}</span>` +
                            `<span class="event-date-badge-day">${escapeHtml(eventBadge.day)}</span>` +
                            '</div>'
                        );
                    }

                    parts.push('<div class="event-heading-content">');
                    parts.push('<div class="event-heading-copy">');
                    if (eventEntry.venue) parts.push(`<h3 class="event-venue">${escapeHtml(eventEntry.venue)}</h3>`);
                    if (eventMeta) parts.push(`<p class="event-meta">${eventMeta}</p>`);
                    parts.push('</div>');
                    if (hasDetails) parts.push(`<p class="event-details">${escapeHtml(eventEntry.details)}</p>`);

                    if (hasEventLink || hasDirections) {
                        parts.push('<div class="event-actions">');
                        if (hasEventLink) {
                            parts.push(
                                `<a href="${escapeHtml(eventLink)}" target="_blank" rel="noopener noreferrer" class="event-link">Open event link</a>`
                            );
                        }
                        if (hasDirections) {
                            parts.push(
                                `<a href="${escapeHtml(directionsUrl)}" target="_blank" rel="noopener noreferrer" class="event-link event-directions">Get directions</a>`
                            );
                        }
                        parts.push('</div>');
                    }

                    parts.push('</div>');
                    parts.push('</div>');

                    parts.push('</div>');

                    if (mapEmbedUrl) {
                        const mapTitle = `Map for ${eventEntry.venue || 'event location'}`;
                        parts.push('<div class="event-card-media">');
                        parts.push(
                            '<figure class="event-photo" data-event-photo hidden>' +
                            '<img data-event-photo-img loading="lazy" alt="Venue photo" />' +
                            '</figure>'
                        );
                        parts.push(
                            `<iframe class="event-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${escapeHtml(mapEmbedUrl)}" title="${escapeHtml(mapTitle)}"></iframe>`
                        );
                        parts.push('</div>');
                    }

                    parts.push('</div>');
                    parts.push('</article>');
                });
                parts.push('</div>');
                return parts.join('');
            }
        };
        
        // Render a section
        function renderSection(section) {
            const renderer = SectionRenderers[section.type];
            if (!renderer) return '<p>Unknown section type</p>';
            
            const content = renderer(section);
            if (!content || !content.trim()) return '';
            const idAttr = section.id ? `id="${section.id}"` : '';
            const classAttr = `section section-${section.type}`;
            
            return `<section ${idAttr} class="${classAttr}">${content}</section>`;
        }
        
        // HTML utilities
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function sanitizeHtml(text) {
            // Allow safe HTML tags (em, strong, etc.) but escape the rest
            if (!text) return '';
            // Simple sanitization - allow common formatting tags
            const allowedTags = ['em', 'strong', 'i', 'b', 'u', 'br'];
            const div = document.createElement('div');
            div.innerHTML = text;
            // Remove script tags and dangerous attributes
            div.querySelectorAll('script, iframe, object, embed').forEach(el => el.remove());
            return div.innerHTML;
        }
        
        // Set copyright year to current year (runs immediately)
        (function() {
            var yearEl = document.getElementById('year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
        })();

        // Initialize page
        const container = document.getElementById('sections-container');
        fetch('/content/site.json')
            .then(response => {
                if (!response.ok) throw new Error('Content unavailable');
                return response.json();
            })
            .then(data => {
                // Update header
                if (data.title) {
                    document.querySelectorAll('[data-content="title"]').forEach(el => el.textContent = data.title);
                    document.title = data.title + ' – Rachel Marie Hannon';
                }
                if (data.subtitle) document.querySelector('[data-content="subtitle"]').textContent = data.subtitle;
                if (data.author) document.querySelector('[data-content="author"]').textContent = data.author;
                
                // Render footer socials (with icons)
                const socialsEl = document.getElementById('footer-socials');
                if (socialsEl && data.socials?.length) {
                    const links = data.socials.map(s => {
                        if (!s.platform || !s.url) return '';
                        const key = s.platform.toLowerCase();
                        const icon = iconSvg(key);
                        const content = icon || escapeHtml(s.platform);
                        return `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="${escapeHtml(s.platform)}">${content}</a>`;
                    }).filter(Boolean);
                    socialsEl.innerHTML = links.length ? links.join('') : '';
                }
                
                // Render sections
                if (container) {
                    if (data.sections && data.sections.length) {
                        container.innerHTML = data.sections.map(renderSection).join('');
                        setTimeout(function() {
                            window.loadSubstackFeeds && window.loadSubstackFeeds();
                            initializeEventEnhancements();
                        }, 50);
                    } else {
                        container.innerHTML = '';
                    }
                }
            })
            .catch(function(err) {
                console.error('Error loading content:', err);
                if (container) {
                    container.innerHTML = '<p class="section-loading section-error">Content could not be loaded. Please try again later.</p>';
                }
            });
    </script>

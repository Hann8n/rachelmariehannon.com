        const iconSvg = (key) => {
            const svg = SOCIAL_ICONS[key.toLowerCase()];
            return svg ? svg.replace('<svg ', '<svg aria-hidden="true" ') : null;
        };
        const placeDetailsCache = new Map();

        function extractPlaceIdFromMapsUrl(urlText) {
            if (!urlText || typeof urlText !== 'string') return '';
            const normalized = normalizeUrl(urlText);
            if (!normalized) return '';

            try {
                const parsed = new URL(normalized);
                const fromQuery = parsed.searchParams.get('query_place_id') || parsed.searchParams.get('place_id');
                if (fromQuery) return fromQuery;

                const qParam = parsed.searchParams.get('q') || parsed.searchParams.get('query');
                if (qParam && qParam.startsWith('place_id:')) {
                    return qParam.replace(/^place_id:/, '');
                }
            } catch (_) {}

            const decoded = decodeURIComponent(normalized);
            const match = decoded.match(/ChI[0-9A-Za-z_-]{10,}/);
            return match ? match[0] : '';
        }

        function normalizeUrl(urlText) {
            if (!urlText || typeof urlText !== 'string') return '';
            try {
                return new URL(urlText).href;
            } catch (_) {
                return '';
            }
        }

        function extractLatLngFromMapsUrl(urlText) {
            const normalized = normalizeUrl(urlText);
            if (!normalized) return null;
            try {
                const parsed = new URL(normalized);
                const atMatch = parsed.pathname.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
                if (atMatch) return { lat: atMatch[1], lng: atMatch[2] };

                const ll = parsed.searchParams.get('ll') || parsed.searchParams.get('sll');
                if (ll && /^-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?$/.test(ll)) {
                    const [lat, lng] = ll.split(',');
                    return { lat, lng };
                }
            } catch (_) {}
            return null;
        }

        function buildDirectionsProviderUrls(options) {
            const placeId = (options && options.placeId ? String(options.placeId) : '').trim();
            const mapsUrl = options && options.mapsUrl ? String(options.mapsUrl) : '';
            const fallbackUrl = normalizeUrl(options && options.fallbackUrl ? String(options.fallbackUrl) : '');
            const destination = [options?.venue, options?.city].filter(Boolean).join(', ').trim();
            const latLng = extractLatLngFromMapsUrl(mapsUrl) || extractLatLngFromMapsUrl(fallbackUrl);

            let google = '';
            if (destination || placeId) {
                const destinationValue = destination || ('place_id:' + placeId);
                google = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(destinationValue);
                if (placeId) {
                    google += '&destination_place_id=' + encodeURIComponent(placeId);
                }
            } else if (fallbackUrl) {
                google = fallbackUrl;
            }

            const apple = destination
                ? 'https://maps.apple.com/?daddr=' + encodeURIComponent(destination) + '&dirflg=d'
                : '';

            let waze = '';
            if (latLng) {
                waze = 'https://waze.com/ul?ll=' + encodeURIComponent(latLng.lat + ',' + latLng.lng) + '&navigate=yes';
            } else if (destination) {
                waze = 'https://waze.com/ul?q=' + encodeURIComponent(destination) + '&navigate=yes';
            }

            return {
                google,
                apple,
                waze,
                fallback: google || fallbackUrl || ''
            };
        }

        function getDirectionsDialog() {
            let overlay = document.getElementById('directions-picker');
            if (overlay) return overlay;

            overlay = document.createElement('div');
            overlay.id = 'directions-picker';
            overlay.className = 'directions-picker';
            overlay.hidden = true;
            overlay.innerHTML =
                '<div class="directions-picker-backdrop" data-close-directions-picker></div>' +
                '<div class="directions-picker-panel" role="dialog" aria-modal="true" aria-labelledby="directions-picker-title">' +
                '<h3 id="directions-picker-title">Open directions in</h3>' +
                '<div class="directions-picker-actions">' +
                '<button type="button" class="directions-picker-option" data-provider="apple">Apple Maps</button>' +
                '<button type="button" class="directions-picker-option" data-provider="google">Google Maps</button>' +
                '<button type="button" class="directions-picker-option" data-provider="waze">Waze</button>' +
                '</div>' +
                '<button type="button" class="directions-picker-cancel" data-close-directions-picker>Cancel</button>' +
                '</div>';
            document.body.appendChild(overlay);
            return overlay;
        }

        function closeDirectionsPicker() {
            const overlay = document.getElementById('directions-picker');
            if (!overlay) return;
            const fastDialog = overlay.querySelector('fast-dialog');
            if (fastDialog && typeof fastDialog.hide === 'function') {
                fastDialog.hide();
            }
            overlay.hidden = true;
            overlay.removeAttribute('data-open');
            overlay.removeAttribute('data-google-url');
            overlay.removeAttribute('data-apple-url');
            overlay.removeAttribute('data-waze-url');
        }

        function openDirectionsPicker(urls, label) {
            const overlay = getDirectionsDialog();
            const title = overlay.querySelector('#directions-picker-title');
            if (title) {
                title.textContent = 'Open directions in:';
            }

            overlay.setAttribute('data-google-url', urls.google || '');
            overlay.setAttribute('data-apple-url', urls.apple || '');
            overlay.setAttribute('data-waze-url', urls.waze || '');
            overlay.hidden = false;
            overlay.setAttribute('data-open', 'true');
            const fastDialog = overlay.querySelector('fast-dialog');
            if (fastDialog && typeof fastDialog.showModal === 'function') {
                fastDialog.showModal();
            }

            ['apple', 'google', 'waze'].forEach((provider) => {
                const btn = overlay.querySelector('[data-provider="' + provider + '"]');
                if (!btn) return;
                const hasUrl = Boolean(urls[provider]);
                btn.disabled = !hasUrl;
                btn.setAttribute('aria-disabled', String(!hasUrl));
            });
        }

        function initializeDirectionsPicker() {
            if (document.body.dataset.directionsPickerReady === 'true') return;
            document.body.dataset.directionsPickerReady = 'true';

            function getDelegatedMatch(event, selector) {
                if (event.target instanceof Element) {
                    const closest = event.target.closest(selector);
                    if (closest) return closest;
                }
                if (typeof event.composedPath === 'function') {
                    const path = event.composedPath();
                    for (const node of path) {
                        if (node instanceof Element && node.matches(selector)) {
                            return node;
                        }
                    }
                }
                return null;
            }

            document.addEventListener('click', async (event) => {
                const closeTrigger = getDelegatedMatch(event, '[data-close-directions-picker]');
                if (closeTrigger) {
                    closeDirectionsPicker();
                    return;
                }

                const providerButton = getDelegatedMatch(event, '[data-provider].directions-picker-option');
                if (providerButton) {
                    const overlay = document.getElementById('directions-picker');
                    if (!overlay) return;
                    const provider = providerButton.getAttribute('data-provider');
                    const url = overlay.getAttribute('data-' + provider + '-url');
                    if (url) {
                        window.open(url, '_blank', 'noopener,noreferrer');
                    }
                    closeDirectionsPicker();
                    return;
                }

                const directionsLink = getDelegatedMatch(event, '.event-directions');
                if (!directionsLink) return;
                event.preventDefault();

                const card = directionsLink.closest('.event-card');
                const placeId = card ? (card.getAttribute('data-place-id') || '').trim() : '';
                const mapsUrl = card ? (card.getAttribute('data-google-maps-url') || '').trim() : '';
                const venue = card ? (card.getAttribute('data-venue') || '').trim() : '';
                const city = card ? (card.getAttribute('data-city') || '').trim() : '';
                const fallbackUrl = directionsLink.getAttribute('data-directions-url') || directionsLink.getAttribute('href') || '';
                const urls = buildDirectionsProviderUrls({ placeId, mapsUrl, venue, city, fallbackUrl });

                if (!urls.fallback) return;
                openDirectionsPicker(urls, venue || '');
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeDirectionsPicker();
                }
            });
        }

        async function fetchPlaceDetails(options) {
            const placeId = options && typeof options.placeId === 'string' ? options.placeId.trim() : '';
            const mapsUrl = options && typeof options.mapsUrl === 'string' ? options.mapsUrl.trim() : '';
            const query = [options?.venue, options?.city].filter(Boolean).join(', ');
            const cacheKey = placeId || mapsUrl || query;
            if (!cacheKey) return null;
            if (placeDetailsCache.has(cacheKey)) {
                return placeDetailsCache.get(cacheKey);
            }
            try {
                const params = new URLSearchParams();
                if (placeId) params.set('placeId', placeId);
                if (mapsUrl) params.set('mapsUrl', mapsUrl);
                if (query) params.set('query', query);
                const response = await fetch('/api/place-details?' + params.toString());
                if (!response.ok) return null;
                const data = await response.json();
                const normalized = {
                    name: typeof data.name === 'string' ? data.name : '',
                    url: normalizeUrl(data.url),
                    photoUrl: typeof data.photoUrl === 'string' ? data.photoUrl : '',
                    resolvedPlaceId: typeof data.resolvedPlaceId === 'string' ? data.resolvedPlaceId : ''
                };
                placeDetailsCache.set(cacheKey, normalized);
                if (normalized.resolvedPlaceId && normalized.resolvedPlaceId !== cacheKey) {
                    placeDetailsCache.set(normalized.resolvedPlaceId, normalized);
                }
                return normalized;
            } catch (_) {
                return null;
            }
        }

        async function enrichEventCardsWithPlaceData() {
            const cards = Array.from(document.querySelectorAll('.event-card[data-google-maps-url]'));
            if (!cards.length) return;

            await Promise.all(cards.map(async (card) => {
                const mapsUrl = card.getAttribute('data-google-maps-url') || '';
                const placeIdAttr = (card.getAttribute('data-place-id') || '').trim();
                const placeId = placeIdAttr || extractPlaceIdFromMapsUrl(mapsUrl);
                const venue = card.getAttribute('data-venue') || '';
                const city = card.getAttribute('data-city') || '';
                if (!placeId && !mapsUrl && !venue && !city) return;

                const place = await fetchPlaceDetails({
                    placeId,
                    mapsUrl,
                    venue,
                    city
                });
                if (!place) return;

                if (!placeIdAttr && place.resolvedPlaceId) {
                    card.setAttribute('data-place-id', place.resolvedPlaceId);
                }

                const directionsLink = card.querySelector('.event-directions');
                if (directionsLink && place.url) {
                    if (directionsLink.tagName === 'A') {
                        directionsLink.setAttribute('href', place.url);
                    }
                    directionsLink.setAttribute('data-directions-url', place.url);
                }

                const photoWrapper = card.querySelector('[data-event-photo]');
                const photoImg = card.querySelector('[data-event-photo-img]');
                if (!photoWrapper || !photoImg || !place.photoUrl) return;
                photoImg.setAttribute('src', place.photoUrl);
                photoImg.setAttribute('alt', (place.name || 'Venue') + ' photo');
                photoWrapper.hidden = false;
            }));
        }

        async function initializeEventEnhancements() {
            initializeDirectionsPicker();
            await enrichEventCardsWithPlaceData();
        }

        function initializeEventMonthLoaders() {
            document.querySelectorAll('[data-events-month-loader]').forEach((sectionRoot) => {
                const list = sectionRoot.querySelector('.events-list');
                const loadMoreRow = sectionRoot.querySelector('.events-load-more-row');
                const loadMoreBtn = sectionRoot.querySelector('[data-events-load-more]');
                if (!list || !loadMoreRow || !loadMoreBtn) return;
                const minimumEventsToAdd = 4;

                const getMonthTemplates = () => Array.from(
                    sectionRoot.querySelectorAll('template[data-events-month-template]')
                );

                const getNextEventsCount = () => {
                    const templates = getMonthTemplates();
                    let projectedCount = 0;
                    for (let idx = 0; idx < templates.length && projectedCount < minimumEventsToAdd; idx += 1) {
                        const monthEventCount = Number(templates[idx].getAttribute('data-event-count') || '0');
                        projectedCount += monthEventCount;
                    }
                    return projectedCount;
                };

                const updateButtonVisibility = () => {
                    const hasRemainingMonths = getMonthTemplates().length > 0;
                    loadMoreBtn.hidden = !hasRemainingMonths;
                    loadMoreBtn.style.display = hasRemainingMonths ? '' : 'none';
                    if (hasRemainingMonths) loadMoreBtn.textContent = 'Show more events';
                };
                let isLoadingMoreEvents = false;

                loadMoreBtn.addEventListener('click', async () => {
                    if (isLoadingMoreEvents || loadMoreBtn.disabled) return;
                    isLoadingMoreEvents = true;
                    loadMoreBtn.disabled = true;
                    loadMoreBtn.setAttribute('aria-busy', 'true');

                    try {
                        let addedEvents = 0;
                        let templates = getMonthTemplates();

                        while (templates.length && addedEvents < minimumEventsToAdd) {
                            const nextTemplate = templates[0];
                            const monthEventCount = Number(nextTemplate.getAttribute('data-event-count') || '0');
                            list.insertBefore(nextTemplate.content.cloneNode(true), loadMoreRow);
                            nextTemplate.remove();
                            addedEvents += monthEventCount;
                            templates = getMonthTemplates();
                        }

                        await enrichEventCardsWithPlaceData();
                    } catch (error) {
                        console.error('Failed to enrich event cards after loading more events.', error);
                    } finally {
                        isLoadingMoreEvents = false;
                        loadMoreBtn.disabled = false;
                        loadMoreBtn.setAttribute('aria-busy', 'false');
                        updateButtonVisibility();
                    }
                });

                updateButtonVisibility();
            });
        }

        function updateAutoStickyHeaders() {
            const sections = document.querySelectorAll('.section-substack, .section-events');
            if (!sections.length) return;

            const minStickyHeight = Math.round(window.innerHeight * 0.75);
            sections.forEach((section) => {
                const shouldStick = section.scrollHeight >= minStickyHeight;
                section.classList.toggle('auto-sticky-on', shouldStick);
            });
        }

        function initializeAutoStickyHeaders() {
            if (document.body.dataset.autoStickyHeadersReady === 'true') return;
            document.body.dataset.autoStickyHeadersReady = 'true';

            const sections = document.querySelectorAll('.section-substack, .section-events');
            if (!sections.length) return;

            let rafId = 0;
            const scheduleUpdate = () => {
                if (rafId) return;
                rafId = window.requestAnimationFrame(() => {
                    rafId = 0;
                    updateAutoStickyHeaders();
                });
            };

            if ('ResizeObserver' in window) {
                const observer = new ResizeObserver(scheduleUpdate);
                sections.forEach((section) => observer.observe(section));
            }

            window.addEventListener('resize', scheduleUpdate, { passive: true });
            window.addEventListener('orientationchange', scheduleUpdate);
            scheduleUpdate();
        }

        function initializeStickyHeaderJump() {
            if (document.body.dataset.stickyHeaderJumpReady === 'true') return;
            document.body.dataset.stickyHeaderJumpReady = 'true';

            document.addEventListener('click', (event) => {
                const stickyHeader = event.target.closest('.auto-sticky-on > .section-header');
                if (!stickyHeader) return;
                if (event.target.closest('a, button')) return;

                const section = stickyHeader.closest('section');
                if (!section) return;
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        }
        
        // HTML utilities
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Set copyright year to current year (runs immediately)
        (function() {
            var yearEl = document.getElementById('year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
        })();

        // Initialize page
        const container = document.getElementById('sections-container');
        if (window.__SSR_RENDERED__ === true) {
            setTimeout(function() {
                initializeAutoStickyHeaders();
                initializeStickyHeaderJump();
                window.loadSubstackFeeds && window.loadSubstackFeeds();
                initializeEventMonthLoaders();
                initializeEventEnhancements();
            }, 50);
        } else {
        fetch('/content/site.json')
            .then(response => {
                if (!response.ok) throw new Error('Content unavailable');
                return response.json();
            })
            .then(data => {
                // Update header
                if (data.title) {
                    document.querySelectorAll('[data-content="title"]').forEach(el => el.textContent = data.title);
                    document.title = data.title + ' – Rachel Marie Hannon';
                }
                if (data.subtitle) document.querySelector('[data-content="subtitle"]').textContent = data.subtitle;
                if (data.author) document.querySelector('[data-content="author"]').textContent = data.author;
                
                const sections = Array.isArray(data.sections) ? data.sections : [];

                // Render footer socials (with icons)
                const socialsEl = document.getElementById('footer-socials');
                if (socialsEl) {
                    const links = [];
                    if (data.socials?.length) {
                        const socialLinks = data.socials.map(s => {
                            if (!s.platform || !s.url) return '';
                            const key = s.platform.toLowerCase();
                            const icon = iconSvg(key);
                            const content = icon || escapeHtml(s.platform);
                            const href = escapeHtml(s.url);
                            const isMailto = /^mailto:/i.test(s.url);
                            const attrs = isMailto ? '' : ' target="_blank" rel="noopener noreferrer"';
                            return `<a href="${href}"${attrs} class="footer-social-link" aria-label="${escapeHtml(s.platform)}">${content}</a>`;
                        }).filter(Boolean);
                        links.push(...socialLinks);
                    }
                    socialsEl.innerHTML = links.length ? links.join('') : '';
                }
                
                // Render sections
                if (container) {
                    if (sections.length) {
                        container.innerHTML = renderSectionsHtml(data, {
                            feedItems: Array.isArray(window.__SUBSTACK_FEED_ITEMS__) ? window.__SUBSTACK_FEED_ITEMS__ : [],
                            skeletonHtml: window.SUBSTACK_SKELETON_HTML || ''
                        });
                        setTimeout(function() {
                            initializeAutoStickyHeaders();
                            initializeStickyHeaderJump();
                            window.loadSubstackFeeds && window.loadSubstackFeeds();
                            initializeEventMonthLoaders();
                            initializeEventEnhancements();
                        }, 50);
                    } else {
                        container.innerHTML = '';
                    }
                }
            })
            .catch(function(err) {
                console.error('Error loading content:', err);
                if (container) {
                    container.innerHTML = '<p class="section-loading section-error">Content could not be loaded. Please try again later.</p>';
                }
            });
        }
    </script>
</body>
</html>

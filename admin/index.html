<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Include the script that builds the page and boots Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Initialize Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          // Handle login
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
          
          // Handle confirmation token if present
          const hash = window.location.hash;
          if (hash.includes('confirmation_token')) {
            // The widget will handle the confirmation automatically
            window.netlifyIdentity.on("confirm", () => {
              // After confirmation, refresh to show logged in state
              window.location.href = "/admin/";
            });
          }
        } else {
          // User is logged in, CMS should initialize
          console.log("User logged in:", user.email);
        }
      });
    }
  </script>
</body>
</html>

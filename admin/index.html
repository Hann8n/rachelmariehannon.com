  <style>
    /* Admin page – uses design tokens from styles.css */
    .admin-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .admin-page main {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }
    .admin-page .admin-hero {
      text-align: center;
      margin-bottom: var(--space-2xl);
    }
    .admin-page .admin-hero h1 {
      font-size: clamp(var(--text-h1), 5vw, var(--text-display));
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-sm);
      line-height: var(--leading-tight);
    }
    .admin-page .admin-hero .subtitle {
      margin-bottom: var(--space-xl);
    }
    .admin-page .button-wrapper {
      text-align: center;
      margin: var(--space-xl) 0;
    }
    .admin-page .admin-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-lg) var(--space-2xl);
      font-size: var(--text-body);
      font-weight: 500;
      font-family: var(--font-body);
      color: var(--color-bg);
      background-color: var(--color-ink);
      border: 1px solid var(--color-ink);
      text-decoration: none;
      transition: opacity var(--transition), background-color var(--transition);
    }
    .admin-page .admin-cta-icon {
      flex-shrink: 0;
    }
    .admin-page .admin-cta:hover {
      opacity: 0.9;
      color: var(--color-bg);
    }
    .admin-page .admin-cta:focus-visible {
      outline: 2px solid var(--color-teal);
      outline-offset: 2px;
    }
    .admin-page .admin-note {
      margin-top: var(--space-2xl);
      margin-left: auto;
      margin-right: auto;
      max-width: 22rem;
      padding: var(--space-lg) var(--space-lg) var(--space-lg) var(--space-xl);
      font-size: var(--text-small);
      color: var(--color-text-soft);
      text-align: center;
      background: hsl(var(--hue-teal) 42% 90% / 0.45);
      border-radius: var(--radius-sm);
    }
    .admin-page .admin-note a {
      color: var(--color-brown-dark);
      text-decoration: underline;
      text-decoration-color: hsl(var(--hue-charcoal) 3% 14% / 0.4);
      text-underline-offset: 0.2em;
      transition: color var(--transition), text-decoration-color var(--transition);
    }
    .admin-page .admin-note a:hover {
      color: var(--color-terracotta);
      text-decoration-color: var(--color-terracotta);
    }
  </style>
</head>
<body class="admin-page">
  <main>
    <div class="admin-hero">
      <h1>Hey Rachel!</h1>
      <p class="subtitle">Ready to update your site?</p>
      <div class="button-wrapper">
        <a href="https://app.pagescms.org/" target="_blank" rel="noopener noreferrer" class="admin-cta"><svg class="admin-cta-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M0 4.8C0 2.14903 2.14903 0 4.8 0H12.0118C13.2848 0 14.5057 0.505713 15.4059 1.40589L22.5941 8.59411C23.4943 9.49429 24 10.7152 24 11.9882V19.2C24 21.851 21.851 24 19.2 24H4.8C2.14903 24 0 21.851 0 19.2V4.8Z"/></svg> click here</a>
      </div>
    </div>
    <div class="admin-note">
      Not Rachel? <a href="/">Head back to the main site</a>
    </div>
  </main>
</body>

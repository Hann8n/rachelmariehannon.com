<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Your Site - Rachel Marie Hannon</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
      padding: 2.5rem 1.5rem;
      min-height: 100vh;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
    }
    h1 {
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: #1a1a1a;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #1a1a1a;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 400;
      margin-bottom: 2rem;
    }
    .section {
      background-color: #fff;
      border: 1px solid #1a1a1a;
      border-left: 3px solid #5DB1A3;
      padding: 2rem 2.25rem;
      margin-bottom: 1.75rem;
    }
    .section h2 {
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
      color: #1a1a1a;
    }
    .section p {
      margin-bottom: 0.75rem;
      color: #1a1a1a;
    }
    .section a {
      color: #7B3C25;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.18s ease, color 0.18s ease;
    }
    .section a:hover {
      color: #DA8861;
      border-bottom-color: #DA8861;
    }
    .steps {
      margin-top: 1.5rem;
    }
    .steps ol {
      margin-left: 1.5rem;
      color: #1a1a1a;
      line-height: 1.8;
    }
    .steps li {
      margin-bottom: 0.5rem;
    }
    .button-wrapper {
      text-align: left;
      margin: 2rem 0;
    }
    .button {
      display: inline-block;
      color: #fff !important;
      background-color: #1a1a1a;
      border: 1px solid #1a1a1a;
      padding: 1rem 2.5rem;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 400;
      transition: opacity 0.18s ease;
    }
    .button:hover {
      opacity: 0.8;
      color: #fff !important;
    }
    .note {
      background-color: rgba(219, 158, 131, 0.05);
      border-left: 3px solid #DB9E83;
      padding: 1rem 1rem 1rem 1.25rem;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #1a1a1a;
    }
    .note a {
      color: #7B3C25;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.18s ease, color 0.18s ease;
    }
    .note a:hover {
      color: #DA8861;
      border-bottom-color: #DA8861;
    }
    @media (max-width: 700px) {
      body {
        padding: 2rem 1.25rem;
      }
      .section {
        padding: 1.75rem 1.6rem;
      }
      .button {
        padding: 0.9rem 2rem;
        font-size: 1rem;
      }
    }
    @media (max-width: 520px) {
      body {
        padding: 1.5rem 1rem;
      }
      .section {
        padding: 1.6rem 1.25rem;
      }
      .button {
        padding: 0.85rem 1.75rem;
        font-size: 0.95rem;
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hey Rachel!</h1>
    <p class="subtitle">Ready to update your site?</p>
    
    <div class="button-wrapper">
      <a href="https://app.pagescms.org/" target="_blank" class="button">
        click here
      </a>
    </div>

    <div class="note">
      Not Rachel? <a href="/">Head back to the main site</a>
    </div>
  </div>
</body>
</html>

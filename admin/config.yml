#   name: github
#   repo: YOUR_USERNAME/YOUR_REPO_NAME # Replace with your GitHub username and repo name
#   branch: main
#   base_url: https://your-site.pages.dev
#   auth_endpoint: api/auth

# For Netlify (RECOMMENDED - Much simpler!):
backend:
  name: git-gateway
  branch: main

media_folder: "images" # Media files will be stored in the repo under images
public_folder: "/images" # The src attribute for uploaded media will begin with /images

collections:
  - name: "site" # Used in routes, e.g., /admin/collections/site
    label: "Site Content"
    file: "content/site.json" # The path to the JSON file
    format: "json" # File format
    fields: # The fields for the document
      - {label: "Site Title", name: "title", widget: "string"}
      - {label: "Subtitle", name: "subtitle", widget: "string"}
      - {label: "Author Name", name: "author", widget: "string"}
      - {label: "About - Lead Paragraph", name: "about_lead", widget: "text"}
      - {label: "About - Second Paragraph", name: "about_second", widget: "text"}
      - label: "Comps"
        name: "comps"
        widget: "list"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
      - label: "Review Quote"
        name: "review"
        widget: "object"
        fields:
          - {label: "Quote Text", name: "quote", widget: "text"}
          - {label: "Attribution", name: "attribution", widget: "string"}
      - label: "Substack Section"
        name: "substack"
        widget: "object"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Button Text", name: "button_text", widget: "string"}
          - {label: "Button URL", name: "button_url", widget: "string"}
          - {label: "Supascribe Embed ID", name: "embed_id", widget: "string"}

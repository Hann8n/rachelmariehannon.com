# Pages CMS Configuration
# Clean, simple configuration following Pages CMS best practices
# Access at: https://app.pagescms.org/

media: images

content:
  - name: site
    label: Site Content
    type: file
    path: content/site.json
    format: json
    fields:
      # Basic site information
      - name: title
        label: Site Title
        type: string
        required: true
        description: The main title of your website
      
      - name: subtitle
        label: Subtitle
        type: string
        required: true
        description: A short tagline or subtitle
      
      - name: author
        label: Author Name
        type: string
        required: true
        description: Your name as the author
      
      # Page sections - the main content
      - name: sections
        label: Page Sections
        type: object
        list: true
        description: Add, edit, and reorder sections on your page
        list:
          collapsible:
            collapsed: false
            summary: "{fields.type} - {fields.title}"
        fields:
          # Section identification
          - name: type
            label: Section Type
            type: select
            required: true
            description: Choose what kind of section this is
            options:
              values:
                - text
                - quote
                - list
                - substack
                - two-column
          
          - name: title
            label: Section Title
            type: string
            required: false
            description: Optional: Main heading for this section. You can use HTML like <em>italics</em>
          
          - name: tagline
            label: Section Tagline
            type: string
            required: false
            description: Optional: A subheading or tagline
          
          - name: id
            label: Section ID
            type: string
            required: false
            description: Optional: Used for anchor links (e.g., 'about', 'contact')
          
          # Text section fields
          - name: content
            label: Main Text Content
            type: text
            required: false
            description: For 'text' sections: Your main paragraph
          
          - name: paragraphs
            label: Additional Paragraphs
            type: object
            list: true
            required: false
            description: For 'text' sections: Add more paragraphs
            fields:
              - name: text
                label: Paragraph Text
                type: text
                required: true
          
          # Quote section fields
          - name: quote
            label: Quote Text
            type: text
            required: false
            description: For 'quote' sections: The quote text
          
          - name: attribution
            label: Quote Attribution
            type: string
            required: false
            description: For 'quote' sections: Who said this (e.g., '– Rachel Marie Hannon')
          
          # List section fields
          - name: items
            label: List Items
            type: object
            list: true
            required: false
            description: For 'list' sections: Add items to your list
            fields:
              - name: title
                label: Item Title
                type: string
                required: true
              - name: description
                label: Item Description
                type: text
                required: true
          
          # Two-column section fields
          - name: left_column
            label: Left Column
            type: object
            required: false
            description: For 'two-column' sections: Content for the left side
            fields:
              - name: title
                label: Title
                type: string
                required: false
              
              - name: items
                label: Items
                type: object
                list: true
                required: false
                fields:
                  - name: title
                    label: Item Title
                    type: string
                    required: true
                  - name: description
                    label: Item Description
                    type: text
                    required: true
          
          - name: right_column
            label: Right Column
            type: object
            required: false
            description: For 'two-column' sections: Content for the right side
            fields:
              - name: title
                label: Title
                type: string
                required: false
              
              - name: content
                label: Content
                type: text
                required: false
                description: Text content (line breaks are preserved)
          
          # Substack section fields
          - name: description
            label: Description
            type: text
            required: false
            description: For 'substack' sections: Description text above the embed
          
          - name: button_text
            label: Button Text
            type: string
            required: false
            description: For 'substack' sections: Text on the button
          
          - name: button_url
            label: Button URL
            type: string
            required: false
            description: For 'substack' sections: Where the button links to
            pattern:
              regex: '^https?://.+'
              message: 'Please enter a valid URL starting with http:// or https://'
          
          - name: embed_id
            label: Supascribe Embed ID
            type: string
            required: false
            description: For 'substack' sections: Your Supascribe embed ID

media: images

content:
  - name: site
    label: Site Content
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: title, label: Site Title, type: string, required: true }
      - { name: subtitle, label: Subtitle, type: string, required: true }
      - { name: author, label: Author Name, type: string, required: true }

      - name: socials
        label: Footer Social Links
        type: object
        list: true
        description: Social media links shown in the footer.
        fields:
          - { name: platform, label: Platform, type: string, required: true, description: "e.g. LinkedIn, Instagram, Facebook, Bluesky" }
          - { name: url, label: URL, type: string, required: true, description: "Full URL to your profile" }

      - name: sections
        label: Page Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: About / text block
            fields:
              - { name: title, label: Title, type: string }
              - { name: tagline, label: Tagline, type: string }
              - { name: id, label: ID, type: string, description: "Optional. For anchor links (e.g. about)." }
              - { name: content, label: Main paragraph, type: text }
              - name: paragraphs
                label: Extra paragraphs
                type: object
                list: true
                fields:
                  - { name: text, label: Paragraph, type: text, required: true }

          - name: quote
            label: Quote
            fields:
              - { name: title, label: Title, type: string }
              - { name: tagline, label: Tagline, type: string }
              - { name: id, label: ID, type: string, description: "Optional. For anchor links." }
              - { name: quote, label: Quote, type: text }
              - { name: attribution, label: Attribution, type: string }

          - name: list
            label: Simple list
            fields:
              - { name: title, label: Title, type: string }
              - { name: tagline, label: Tagline, type: string }
              - { name: id, label: ID, type: string, description: "Optional. For anchor links." }
              - name: items
                label: Items
                type: object
                list: true
                fields:
                  - { name: title, label: Title, type: string, required: true }
                  - { name: description, label: Description, type: text, required: true }

          - name: two-column
            label: Two columns (e.g. Comps & Review)
            fields:
              - { name: id, label: ID, type: string, description: "Optional. For anchor links (e.g. comps-review)." }
              - name: left_column
                label: Left column
                type: object
                fields:
                  - { name: title, label: Column title, type: string }
                  - name: items
                    label: Items
                    type: object
                    list: true
                    fields:
                      - { name: title, label: Title, type: string, required: true }
                      - { name: description, label: Description, type: text, required: true }
              - name: right_column
                label: Right column
                type: object
                fields:
                  - { name: title, label: Column title, type: string }
                  - { name: content, label: Content, type: text }

          - name: substack
            label: Substack
            fields:
              - { name: title, label: Title, type: string }
              - { name: tagline, label: Tagline, type: string }
              - { name: id, label: ID, type: string, description: "Optional. For anchor links." }
              - { name: description, label: Intro text, type: text }
              - { name: button_text, label: Button text, type: string }
              - { name: button_url, label: Button URL, type: string }
              - { name: embed_id, label: Embed ID, type: string, description: "From your Substack/Supascribe embed. Only change if you replace the feed." }

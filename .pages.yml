media: images

content:
  - name: site
    label: Site Content
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: title, label: Site Title, type: string, required: true }
      - { name: subtitle, label: Subtitle, type: string, required: true }
      - { name: author, label: Author Name, type: string, required: true }
      
      - name: sections
        label: Page Sections
        type: object
        list: true
        fields:
          - name: type
            label: Section Type
            type: select
            required: true
            options:
              values:
                - text
                - quote
                - list
                - substack
                - two-column
          
          - { name: title, label: Section Title, type: string }
          - { name: tagline, label: Section Tagline, type: string }
          - { name: id, label: Section ID, type: string }
          
          - { name: content, label: Main Text Content, type: text }
          
          - name: paragraphs
            label: Additional Paragraphs
            type: object
            list: true
            fields:
              - { name: text, label: Paragraph Text, type: text, required: true }
          
          - { name: quote, label: Quote Text, type: text }
          - { name: attribution, label: Quote Attribution, type: string }
          
          - name: items
            label: List Items
            type: object
            list: true
            fields:
              - { name: title, label: Item Title, type: string, required: true }
              - { name: description, label: Item Description, type: text, required: true }
          
          - name: left_column
            label: Left Column
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - name: items
                label: Items
                type: object
                list: true
                fields:
                  - { name: title, label: Item Title, type: string, required: true }
                  - { name: description, label: Item Description, type: text, required: true }
          
          - name: right_column
            label: Right Column
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: content, label: Content, type: text }
          
          - { name: description, label: Description, type: text }
          - { name: button_text, label: Button Text, type: string }
          - { name: button_url, label: Button URL, type: string }
          - { name: embed_id, label: Supascribe Embed ID, type: string }
